name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make check
      - name: Build linux/amd64 preview image
        run: docker compose build
      - name: Start disposable preview and wait for readiness
        run: |
          docker compose up --detach --wait --wait-timeout 300
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 2 --max-time 10 \
            http://localhost:8080/realms/neurwerk/.well-known/openid-configuration > /dev/null
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 2 --max-time 10 \
            http://localhost:8025/readyz > /dev/null
      - run: make integration
      - name: Upload browser previews and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-preview
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Collect disposable preview logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log 2>&1
          docker compose ps --all > artifacts/compose-status.txt 2>&1
      - name: Upload failure diagnostics (synthetic local data only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-failure-diagnostics
          path: |
            artifacts/
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove disposable preview containers
        if: always()
        run: docker compose down --remove-orphans
