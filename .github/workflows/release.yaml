name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require an exact release tag matching VERSION
        id: version
        shell: bash
        run: |
          version=$(<VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
  validate:
    needs: version
    uses: ./.github/workflows/validate.yaml
    permissions:
      contents: read
  publish:
    needs: [version, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        env:
          IMAGE: ghcr.io/neurwerk/k8s-stack-keycloak-theme:${{ needs.version.outputs.version }}
        run: |
          if result=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            printf 'Image %s already exists; release a new version instead.\n' "$IMAGE" >&2
            exit 1
          fi
          case "$result" in
            *"manifest unknown"*|*"not found"*) ;;
            *) printf '%s\n' "$result" >&2; exit 1 ;;
          esac
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/neurwerk/k8s-stack-keycloak-theme:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/neurwerk/k8s_stack_keycloak_theme
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
